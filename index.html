<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 1200px桌面内容 + 两侧各24px留白；省略initial-scale，让手机自动整页适配。 -->
<meta name="viewport" content="width=1248">
<title></title>
<style>
:root {
  /* 数值来自参考页 CSS / computed style；教学提示的新增数值单独命名。 */
  --zero: 0px; --full: 100%;
  --font-family: "Times New Roman";
  --body-size: 16px; --body-weight: 400;
  /* 参考图数字约为18px；中文维持16px。 */
  --number-size: 18px; --number-weight: 400;
  --number-family: "Times New Roman", Times, "Nimbus Roman", serif;
  --title-size: 32px; --title-weight: 700;
  --note-size: 14px; --title-top: 10px;
  --page-width: 1200px; --content-top: 20px;
  --left-width: 50%; --left-row-width: 95%; --left-line: 35px;
  --right-width: 47%; --source-box-height: 100%; --source-right-height: 60%;
  --rule: 1px; --ink: #000; --paper: #fff;
  --qr-width: 110px; --qr-height: 110px; --qr-margin: 10px;
  --top-height: 70px; --paragraph-pad: 10px;
  --paragraph-width: 96%; --paragraph-line: 50px; --paragraph-indent: 20px;
  --field-height: 20px; --year-width: 25%; --day-width: 10%;
  --footer-top: 30px; --field-left: 60px; --date-left: 58%;
  --next-year-width: 10%; --next-day-width: 5%;
  /* 以下是新增的教学提示设计值，不是参考页实测值。 */
  --demo-left: 24px; --demo-bottom: 20px;
  --layout-side-space: 24px;
  --minimum-page-width: calc(var(--page-width) + var(--layout-side-space) * 2);
}
body, div, ul, li, p, span, h1 { margin: var(--zero); padding: var(--zero); }
html { -webkit-text-size-adjust: var(--full); text-size-adjust: var(--full); }
body { min-width: var(--minimum-page-width); font-family: var(--font-family); font-size: var(--body-size); font-weight: var(--body-weight); color: var(--ink); background: var(--paper); }
.title { margin-top: var(--title-top); width: var(--full); }
.title h1 { width: var(--full); text-align: center; font-size: var(--title-size); font-weight: var(--title-weight); }
.box { width: var(--page-width); height: var(--source-box-height); margin: var(--zero) auto; padding-top: var(--content-top); }
.box p { font-size: var(--body-size); }
.box_left, .box_right { float: left; }
.box_left { width: var(--left-width); }
.box_left li { list-style: none; line-height: var(--left-line); width: var(--left-row-width); }
.box .box_left img { width: var(--qr-width); height: var(--qr-height); }
.qr-row { margin: var(--qr-margin); }
.box .box_left .note { font-size: var(--note-size); }
.box_right { width: var(--right-width); height: var(--source-right-height); border: var(--rule) solid var(--ink); }
.box_right .top { width: var(--full); height: var(--top-height); border-bottom: var(--rule) solid var(--ink); }
.box_right .top p { text-align: center; line-height: var(--top-height); }
.box_right .zh p { padding-left: var(--paragraph-pad); width: var(--paragraph-width); line-height: var(--paragraph-line); text-indent: var(--paragraph-indent); }
.span_x { text-decoration: underline; }
.span_z, .span_d, .span_b { height: var(--field-height); border-bottom: var(--rule) solid var(--ink); display: inline-block; }
.span_z { width: var(--year-width); }
.span_d { width: var(--day-width); }
.box_right .bom { padding-left: var(--paragraph-pad); margin-top: var(--footer-top); }
.p_left { margin-left: var(--field-left); }
.box_right .bom p { line-height: var(--paragraph-line); }
.box_right span { line-height: var(--field-height); text-align: center; }
.p_left.signed-date { margin-left: var(--date-left); }
.next-year { width: var(--next-year-width); }
.next-day { width: var(--next-day-width); }
/* 单独控制数字，避免加粗中文或改变表格尺寸。 */
.box .number { font-family: var(--number-family); font-size: var(--number-size); font-weight: var(--number-weight); line-height: inherit; font-style: normal; font-variant-numeric: lining-nums proportional-nums; }
.demo-notice { position: fixed; left: var(--demo-left); bottom: var(--demo-bottom); font: inherit; line-height: var(--left-line); }
</style>
</head>
<body>
<script>
// 所有页面可见文字、替代文字、标题与业务数据均在此修改。
const DATA = Object.freeze({
  pageTitle: "检测报告上传事项通知书",
  heading: "广东省雷电防护装置检测标识",
  fields: [
    ["被检项目名称：  ", "汕头市世昌文化设施建设项目二期"],
    ["被检项目地址：  ", "汕头市濠江区礐石街道珠浦改造片区D09单元内"],
    ["被检单位名称：  ", "汕头市世昌文化发展有限公司"],
    ["登记区域:  ", ""],
    ["登记日期:  ", "2026年06月30日"]
  ],
  qrFile: "qrcode.png",
  qrAlt: "二维码",
  qrPayload: "TEACHING EXAMPLE ONLY | FICTIONAL DATA | NOT A CERTIFICATE",
  note: "备注：本标识为检测报告通过广东政务服务网获取的唯一身份标识，请扫描二维码进行查询",
  sectionTitle: "雷电防护装置检测登记", sectionType: "（定期检测）",
  intro: "经", yearUnit: "年", monthUnit: "月", dayUnit: "日",
  year: "2026", month: "06", day: "22", nextYear: "2027",
  statementLead: "检测，我单位承诺检测报告书所列雷电防护装置，",
  statementEmphasis: "符合",
  statementEnd: "国家有关雷电防护标准和国务院气象主管机构规定的使用要求。",
  companyLabel: "检测单位（盖章）：", company: "广东百立防雷科技有限公司",
  qualificationLabel: "检测单位资质证号：", qualification: "1192024006",
  staffLabel: "检测人员：", staff: "陈哲杏，陈志豪",
  nextLabel: "提示：下次检测日期为", nextEnd: "日前。",
  telephoneLabel: "检测单位联系电话：", telephone: "020-86693657",
  helpLine: "举报投诉电话：020-87657107",
  disclaimer: " "
});
document.title = DATA.pageTitle;
// 手机通过viewport自动适配整个桌面版，不切换单栏，也不锁定用户缩放。
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 只格式化可见文本；文件路径和alt属性保持纯文本。
const numericText = value => esc(value).replace(/[0-9]+(?:[-.][0-9]+)*/g, digits => `<span class="number">${digits}</span>`);
const d = Object.fromEntries(Object.entries(DATA).filter(([k]) => k !== 'fields').map(([k,v]) => [k, k.startsWith('qr') ? esc(v) : numericText(v)]));
document.body.insertAdjacentHTML('afterbegin', `
  <div class="title"><h1>${d.heading}</h1></div>
  <div class="box">
    <div class="box_left"><ul>
      ${DATA.fields.map(([label,value]) => `<li><span>${numericText(label)}</span><span>${numericText(value)}</span></li>`).join('\n')}
      <li class="qr-row"><img src="${d.qrFile}" alt="${d.qrAlt}"></li>
      <li><p class="note">${d.note}</p></li>
    </ul></div>
    <div class="box_right">
      <div class="top"><p>${d.sectionTitle}<span>${d.sectionType}</span></p></div>
      <div class="zh"><p>${d.intro}
        <span class="span_x">${d.year}</span> ${d.yearUnit}
        <span class="span_x">${d.month}</span> ${d.monthUnit}
        <span class="span_x">${d.day}</span> ${d.dayUnit}
        ${d.statementLead}<span>${d.statementEmphasis}</span>${d.statementEnd}</p></div>
      <div class="bom">
        <p class="p_left">${d.companyLabel}<span class="span_b">${d.company}</span></p>
        <p class="p_left">${d.qualificationLabel}<span class="span_b">${d.qualification}</span></p>
        <p class="p_left">${d.staffLabel}<span class="span_b">${d.staff}</span></p>
        <p class="p_left signed-date">
          <span class="span_z">${d.year}</span> ${d.yearUnit}
          <span class="span_d">${d.month}</span> ${d.monthUnit}
          <span class="span_d">${d.day}</span> ${d.dayUnit}
        </p>
        <p>${d.nextLabel} <span class="span_z next-year">${d.nextYear}</span> ${d.yearUnit} <span class="span_d next-day">${d.month}</span> ${d.monthUnit} <span class="span_d next-day">${d.day}</span> ${d.nextEnd}</p>
        <p>${d.telephoneLabel}<span>${d.telephone}</span></p>
        <p>${d.helpLine}</p>
      </div>
    </div>
  </div>
  <div class="demo-notice" role="note">${d.disclaimer}</div>
`);
</script>
</body>
</html>
